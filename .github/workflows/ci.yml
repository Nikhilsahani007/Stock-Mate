name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot
          POSTGRES_DB: stockpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stockpilot:stockpilot@localhost:5432/stockpilot_test
      TEST_DATABASE_URL: postgresql://stockpilot:stockpilot@localhost:5432/stockpilot_test
      SHADOW_DATABASE_URL: postgresql://stockpilot:stockpilot@localhost:5432/stockpilot_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check migrations match the schema
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE stockpilot_shadow"
          pnpm --filter @stockpilot/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - run: pnpm typecheck
      - run: pnpm build
      - name: Tests (unit, API integration, tenant isolation)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot
          POSTGRES_DB: stockpilot_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://stockpilot:stockpilot@localhost:5432/stockpilot_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stockpilot/shared build
      - run: pnpm --filter @stockpilot/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
